name: National broadband provider inventory
on:
  push:
    branches:
      - internet4all-broadband-data-foundation-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate importer with offline fixture
        run: node scripts/broadband-data/import-national-providers.mjs --fixture tests/fixtures/bdc-state.json --out data/broadband-research/test-fixture
      - name: Inspect official Esri FCC dataset metadata
        run: node scripts/broadband-data/discover-providers.mjs
      - name: Import all state-level ISP offering records
        run: node scripts/broadband-data/import-national-providers.mjs --level states
      - name: Import all county-level ISP offering records
        run: node scripts/broadband-data/import-national-providers.mjs --level counties
      - name: Upload reviewable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadband-national-provider-inventory
          path: data/broadband-research/
          if-no-files-found: ignore
          retention-days: 30
